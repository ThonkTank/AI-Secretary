name: Verify and publish Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release_scope:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      verification_tree: ${{ steps.content.outputs.tree }}
      verification_profile: ${{ steps.scope.outputs.verification_profile }}
      verification_policy: ${{ steps.scope.outputs.verification_policy }}
      verification_reasons: ${{ steps.scope.outputs.verification_reasons }}
      build_required: ${{ steps.scope.outputs.build_required }}
      goldens_required: ${{ steps.scope.outputs.goldens_required }}
      normal_instrumentation_required: ${{ steps.scope.outputs.normal_instrumentation_required }}
      historical_upgrades_required: ${{ steps.scope.outputs.historical_upgrades_required }}
      animation_matrix: ${{ steps.scope.outputs.animation_matrix }}
      quality_required: ${{ steps.scope.outputs.quality_required }}
      instrumentation_required: ${{ steps.scope.outputs.instrumentation_required }}
      release_required: ${{ steps.scope.outputs.release_required }}
      reuse_pr_verification: ${{ steps.reuse.outputs.reuse_pr_verification || 'false' }}
      verification_reason: ${{ steps.reuse.outputs.verification_reason || 'not_evaluated' }}
      verification_pr_number: ${{ steps.reuse.outputs.verification_pr_number }}
      verification_pr_head_sha: ${{ steps.reuse.outputs.verification_pr_head_sha }}
      verification_run_id: ${{ steps.reuse.outputs.verification_run_id }}
      upgrade_matrix: ${{ steps.upgrade-fixtures.outputs.upgrade_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Bind the actual checked-out content
        id: content
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
      - name: Classify verification and release scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/ci/change_scope.py --all >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" = pull_request ]; then
            FROM_SHA="$BASE_SHA"
          else
            FROM_SHA="$BEFORE_SHA"
          fi
          python3 scripts/ci/change_scope.py --base "$FROM_SHA" --head "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Prove a content-identical green pull-request verification
        id: reuse
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/ci/reuse_pr_verification.py \
            --event-name "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --release-required "${{ steps.scope.outputs.release_required }}" \
            --profile "${{ steps.scope.outputs.verification_profile }}" \
            --policy-version "${{ steps.scope.outputs.verification_policy }}" \
            --repository "${{ github.repository }}" \
            --main-sha "${{ github.sha }}" \
            --workflow verify.yml
      - name: Resolve the signed production upgrade matrix
        id: upgrade-fixtures
        run: |
          set -euo pipefail
          UPGRADE_MATRIX=$(python3 scripts/release/upgrade_fixture_tool.py matrix \
            --fixtures release/upgrade-fixtures)
          printf 'upgrade_matrix=%s\n' "$UPGRADE_MATRIX" >> "$GITHUB_OUTPUT"

  verification-content:
    name: verification-content (${{ needs.release_scope.outputs.verification_tree }})
    needs: [release_scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Prove the content executed by this workflow
        env:
          EXPECTED_TREE: ${{ needs.release_scope.outputs.verification_tree }}
        run: test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"

  verification-policy:
    name: verification-policy (${{ needs.release_scope.outputs.verification_policy }}, ${{ needs.release_scope.outputs.verification_profile }})
    needs: [release_scope]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate and explain the selected verification policy
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 scripts/ci/verification_gate.py policy
          python3 - <<'PYTHON'
          import json, os
          scope = json.loads(os.environ["VERIFICATION_NEEDS"])["release_scope"]["outputs"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as report:
              report.write("Verification profile: **" + scope["verification_profile"] + "**; policy " + scope["verification_policy"] + "\n\n")
              for reason in json.loads(scope["verification_reasons"]):
                  report.write("- " + reason + "\n")
              report.write("\nPR evidence reuse: " + scope["reuse_pr_verification"] + " (" + scope["verification_reason"] + ")\n")
          PYTHON
      - name: Documentation and repository contracts
        if: needs.release_scope.outputs.verification_profile == 'docs' && needs.release_scope.outputs.reuse_pr_verification != 'true'
        run: ./scripts/ci/check-docs.sh

  quality-contracts:
    if: >-
      needs.release_scope.outputs.quality_required == 'true' &&
      needs.release_scope.outputs.reuse_pr_verification != 'true'
    needs: [release_scope]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: CI, release, unit and architecture contracts
        timeout-minutes: 12
        env:
          VERIFICATION_PROFILE: ${{ needs.release_scope.outputs.verification_profile }}
        run: |
          if [ "$VERIFICATION_PROFILE" = host ]; then
            ./scripts/ci/check-host.sh
          else
            ./scripts/ci/check-fast.sh
          fi
      - name: Upload contract failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-contract-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  quality-goldens:
    if: >-
      needs.release_scope.outputs.goldens_required == 'true' &&
      needs.release_scope.outputs.reuse_pr_verification != 'true'
    needs: [release_scope]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Visual golden contracts
        timeout-minutes: 12
        run: ./scripts/ci/check-goldens.sh
      - name: Upload golden failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-golden-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            app/build/reports/goldens/
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  quality-build:
    if: >-
      needs.release_scope.outputs.build_required == 'true' &&
      needs.release_scope.outputs.reuse_pr_verification != 'true'
    needs: [release_scope]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Lint and installable APKs
        timeout-minutes: 25
        run: ./gradlew lintDebug assembleDebug assembleInstrumentation assembleInstrumentationAndroidTest assembleRelease
      - name: Enforce isolated instrumentation identity
        run: ./scripts/ci/verify-instrumentation-identity.sh
      - name: Enforce compact install artifacts
        run: |
          test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -lt 10485760
          test "$(stat -c%s app/build/outputs/apk/release/app-release-unsigned.apk)" -lt 8388608
          test "$(du -cb app/src/main/res/font/*.ttf | tail -1 | cut -f1)" -lt 1677722
      - name: Upload build failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: quality-build-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            app/build/reports/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/instrumentation/app-instrumentation.apk
            app/build/outputs/apk/androidTest/instrumentation/app-instrumentation-androidTest.apk
            app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: ignore
          retention-days: 14

  quality:
    name: quality
    if: always() && needs.release_scope.outputs.quality_required == 'true'
    needs: [release_scope, verification-policy, verification-content, quality-contracts, quality-goldens, quality-build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require the selected quality verification outcomes
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/verification_gate.py quality

  instrumentation:
    if: >-
      needs.release_scope.outputs.normal_instrumentation_required == 'true' &&
      needs.release_scope.outputs.reuse_pr_verification != 'true'
    needs: [quality, release_scope]
    runs-on: ubuntu-latest
    env:
      INSTRUMENTATION_API_LEVEL: ${{ matrix.api-level }}
      INSTRUMENTATION_PREPARE_INTERACTION_DEVICE: "true"
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
            arch: x86_64
            channel: stable
          - api-level: 35
            target: google_apis
            arch: x86_64
            channel: stable
          - api-level: "37.0"
            target: google_apis
            arch: x86_64
            channel: canary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update SDK tools for minor-versioned preview packages
        if: matrix.channel != 'stable'
        run: ./scripts/ci/prepare-preview-sdk-tools.sh
      - name: Instrumentation and migration tests on API ${{ matrix.api-level }}
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          channel: ${{ matrix.channel }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: adb start-server
          script: ./scripts/ci/run-instrumentation.sh
      - name: Upload instrumentation failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: instrumentation-failure-api-${{ matrix.api-level }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/reports/instrumentation/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 14

  animation-instrumentation:
    if: >-
      needs.release_scope.outputs.instrumentation_required == 'true' &&
      needs.release_scope.outputs.reuse_pr_verification != 'true'
    needs: [quality, release_scope]
    runs-on: ubuntu-latest
    env:
      INSTRUMENTATION_API_LEVEL: ${{ matrix.api-level }}
      INSTRUMENTATION_ANIMATION_SCALE: "1.0"
      INSTRUMENTATION_PREPARE_INTERACTION_DEVICE: "true"
      INSTRUMENTATION_TEST_CLASS: ${{ needs.release_scope.outputs.verification_profile == 'today' && 'de.thonktank.autosecretary.ui.today.TodayInteractionInstrumentationTest' || 'de.thonktank.autosecretary.TaskEditorComposeInstrumentationTest,de.thonktank.autosecretary.TaskEditorComposeApi37InstrumentationTest,de.thonktank.autosecretary.AllTasksComposeInstrumentationTest,de.thonktank.autosecretary.AllTasksComposeApi37InstrumentationTest,de.thonktank.autosecretary.FlowTileEditorInstrumentationTest,de.thonktank.autosecretary.FlowTileEditorAccessibleInstrumentationTest,de.thonktank.autosecretary.FlowProductEditorInstrumentationTest,de.thonktank.autosecretary.ui.today.TodayInteractionInstrumentationTest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release_scope.outputs.animation_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update SDK tools for minor-versioned preview packages
        if: matrix.channel != 'stable'
        run: ./scripts/ci/prepare-preview-sdk-tools.sh
      - name: Animation-on interaction tests on API ${{ matrix.api-level }}
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          channel: ${{ matrix.channel }}
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: adb start-server
          script: ./scripts/ci/run-instrumentation.sh
      - name: Upload animation instrumentation failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: animation-instrumentation-failure-api-${{ matrix.api-level }}-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            build/reports/instrumentation/
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          retention-days: 14

  instrumentation-gate:
    name: instrumentation-gate
    if: always()
    needs: [quality, release_scope, verification-policy, verification-content, instrumentation, animation-instrumentation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require the selected android verification outcomes
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/verification_gate.py android

  pr-gate:
    name: pull-request-gate
    if: always() && github.event_name == 'pull_request'
    needs: [quality, release_scope, verification-policy, verification-content, instrumentation-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require the selected pr verification outcomes
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/verification_gate.py pr

  package:
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.release_scope.outputs.release_required == 'true' &&
      (needs.release_scope.outputs.reuse_pr_verification == 'true' ||
      needs.quality.result == 'success') && needs.instrumentation-gate.result == 'success'
    needs: [quality, instrumentation-gate, release_scope]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      already_published: ${{ steps.plan.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Determine or resume the release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASES="$RUNNER_TEMP/releases.json"
          PLAN="$RUNNER_TEMP/release-plan.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'add' > "$RELEASES"
          python3 scripts/release/release_tool.py plan \
            --properties release/release.properties \
            --commit "$GITHUB_SHA" --releases "$RELEASES" --output "$PLAN"
          ACTION=$(jq -r .action "$PLAN")
          if [ "$ACTION" = already_published ]; then
            printf 'already_published=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'already_published=false\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'PLAN=%s\n' "$PLAN" >> "$GITHUB_ENV"
          printf 'VERSION_CODE=%s\n' "$(jq -r .versionCode "$PLAN")" >> "$GITHUB_ENV"
          printf 'VERSION_NAME=%s\n' "$(jq -r .versionName "$PLAN")" >> "$GITHUB_ENV"
          printf 'APK_ASSET=%s\n' "$(jq -r .apkAsset "$PLAN")" >> "$GITHUB_ENV"
          printf 'METADATA_ASSET=%s\n' "$(jq -r .metadataAsset "$PLAN")" >> "$GITHUB_ENV"
          printf 'EXPECTED_SIGNER=%s\n' "$(jq -r .signerSha256 "$PLAN")" >> "$GITHUB_ENV"
          printf 'ANDROID_BUILD_TOOLS=%s\n' "$(jq -r .androidBuildTools "$PLAN")" >> "$GITHUB_ENV"
      - name: Pin the current published source before building
        if: steps.plan.outputs.already_published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/release/current_upgrade_smoke.py --plan "$PLAN" \
            --releases "$RUNNER_TEMP/releases.json" \
            --output-dir "$RUNNER_TEMP/current-upgrade-smoke"
      - name: Build, sign and validate the production candidate once
        if: steps.plan.outputs.already_published != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS || 'release' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/autosecretary.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          ACTUAL_CERT=$(keytool -list -v -keystore "$KEYSTORE" \
            -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL_CERT" = "$EXPECTED_SIGNER"
          export SIGNING_STORE_FILE="$KEYSTORE"
          ./gradlew assembleRelease assembleInstrumentationAndroidTest \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" \
            -PrequireReleaseSigning=true -PupgradeProbeRunner=true \
            -PcurrentUpgradeSmokeAssets="$RUNNER_TEMP/current-upgrade-smoke/assets"
          CANDIDATE="$RUNNER_TEMP/release-candidate"
          mkdir -p "$CANDIDATE"
          cp -R "$RUNNER_TEMP/current-upgrade-smoke" "$CANDIDATE/current-upgrade"
          cp app/build/outputs/apk/release/app-release.apk "$CANDIDATE/$APK_ASSET"
          APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$CANDIDATE/upgrade-test.apk" \
            app/build/outputs/apk/androidTest/instrumentation/app-instrumentation-androidTest.apk
          for SIGNED_APK in "$CANDIDATE/$APK_ASSET" "$CANDIDATE/upgrade-test.apk"; do
            "$APKSIGNER" verify --verbose "$SIGNED_APK"
            APK_CERT=$($APKSIGNER verify --print-certs "$SIGNED_APK" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | tr '[:upper:]' '[:lower:]')
            test "$APK_CERT" = "$EXPECTED_SIGNER"
          done
          BADGING=$($AAPT dump badging "$CANDIDATE/$APK_ASSET" | sed -n '1p')
          PACKAGE_NAME=$(jq -r .packageName "$PLAN")
          case "$BADGING" in
            *"package: name='$PACKAGE_NAME'"*"versionCode='$VERSION_CODE'"*"versionName='$VERSION_NAME'"*) ;;
            *) echo "Unexpected package/version: $BADGING" >&2; exit 1 ;;
          esac
          UPGRADE_BADGING=$($AAPT dump badging "$CANDIDATE/upgrade-test.apk" | sed -n '1p')
          case "$UPGRADE_BADGING" in
            *"package: name='$PACKAGE_NAME.test'"*) ;;
            *) echo "Unexpected production probe package: $UPGRADE_BADGING" >&2; exit 1 ;;
          esac
          UPGRADE_MANIFEST=$($AAPT dump xmltree "$CANDIDATE/upgrade-test.apk" AndroidManifest.xml)
          case "$UPGRADE_MANIFEST" in
            *'android:name(0x01010003)="de.thonktank.autosecretary.UpgradeProbeInstrumentation"'*) ;;
            *) echo "Production probe uses the wrong runner" >&2; exit 1 ;;
          esac
          case "$UPGRADE_MANIFEST" in
            *"android:targetPackage(0x01010021)=\"$PACKAGE_NAME\""*) ;;
            *) echo "Production probe targets the wrong package" >&2; exit 1 ;;
          esac
          cp "$PLAN" "$CANDIDATE/release-plan.json"
          python3 scripts/release/release_tool.py metadata --plan "$PLAN" \
            --apk "$CANDIDATE/$APK_ASSET" --output "$CANDIDATE/$METADATA_ASSET"
          python3 scripts/release/release_tool.py validate --plan "$PLAN" \
            --metadata "$CANDIDATE/$METADATA_ASSET" --apk "$CANDIDATE/$APK_ASSET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.plan.outputs.already_published != 'true'
        with:
          name: production-release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  upgrade:
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.package.result == 'success' && needs.package.outputs.already_published != 'true' &&
      needs.release_scope.outputs.historical_upgrades_required == 'true'
    needs: [package, release_scope]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release_scope.outputs.upgrade_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate
      - name: Validate candidate and fetch the signed fixture source
        env:
          GH_TOKEN: ${{ github.token }}
          FIXTURE_ID: ${{ matrix.fixture_id }}
          EXPECTED_SOURCE_TAG: ${{ matrix.source_tag }}
        run: |
          set -euo pipefail
          CANDIDATE="$RUNNER_TEMP/release-candidate"
          PLAN="$CANDIDATE/release-plan.json"
          FIXTURE="$RUNNER_TEMP/upgrade-fixture.json"
          python3 scripts/release/upgrade_fixture_tool.py fixture \
            --fixtures release/upgrade-fixtures --fixture-id "$FIXTURE_ID" \
            --output "$FIXTURE"
          SOURCE_TAG=$(jq -r .source.tag "$FIXTURE")
          test "$SOURCE_TAG" = "$EXPECTED_SOURCE_TAG"
          SOURCE_APK_ASSET=$(jq -r .source.apkAsset "$FIXTURE")
          SOURCE_METADATA_ASSET=$(jq -r .source.metadataAsset "$FIXTURE")
          APK_ASSET=$(jq -r .apkAsset "$PLAN")
          METADATA_ASSET=$(jq -r .metadataAsset "$PLAN")
          PACKAGE_NAME=$(jq -r .packageName "$PLAN")
          CANDIDATE_VERSION=$(jq -r .versionCode "$PLAN")
          EXPECTED_SIGNER=$(jq -r .signerSha256 "$PLAN")
          BUILD_TOOLS=$(jq -r .androidBuildTools "$PLAN")
          python3 scripts/release/release_tool.py validate --plan "$PLAN" \
            --metadata "$CANDIDATE/$METADATA_ASSET" --apk "$CANDIDATE/$APK_ASSET"
          SOURCE_DIR="$RUNNER_TEMP/source-release-$FIXTURE_ID"
          mkdir -p "$SOURCE_DIR"
          RELEASE_JSON="$SOURCE_DIR/release.json"
          TAG_REF_JSON="$SOURCE_DIR/tag-ref.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$SOURCE_TAG" > "$RELEASE_JSON"
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$SOURCE_TAG" > "$TAG_REF_JSON"
          gh release download "$SOURCE_TAG" --dir "$SOURCE_DIR" \
            --pattern "$SOURCE_APK_ASSET" --pattern "$SOURCE_METADATA_ASSET"
          SOURCE_APK="$SOURCE_DIR/$SOURCE_APK_ASSET"
          SOURCE_METADATA="$SOURCE_DIR/$SOURCE_METADATA_ASSET"
          python3 scripts/release/upgrade_fixture_tool.py verify-source \
            --fixture "$FIXTURE" --release-json "$RELEASE_JSON" \
            --tag-ref-json "$TAG_REF_JSON" --metadata "$SOURCE_METADATA" \
            --apk "$SOURCE_APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          for SIGNED_APK in "$SOURCE_APK" "$CANDIDATE/$APK_ASSET" "$CANDIDATE/upgrade-test.apk"; do
            "$APKSIGNER" verify --verbose "$SIGNED_APK"
            APK_CERT=$($APKSIGNER verify --print-certs "$SIGNED_APK" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | tr '[:upper:]' '[:lower:]')
            test "$APK_CERT" = "$EXPECTED_SIGNER"
          done
          SOURCE_VERSION_NAME=$(jq -r .source.versionName "$FIXTURE")
          SOURCE_VERSION_CODE=$(jq -r .source.versionCode "$FIXTURE")
          SOURCE_BADGING=$($AAPT dump badging "$SOURCE_APK" | sed -n '1p')
          case "$SOURCE_BADGING" in
            *"package: name='$PACKAGE_NAME'"*"versionCode='$SOURCE_VERSION_CODE'"*"versionName='$SOURCE_VERSION_NAME'"*) ;;
            *) echo "Unexpected fixture source package/version: $SOURCE_BADGING" >&2; exit 1 ;;
          esac
          ACTUAL_SOURCE_VERSION=$(printf '%s\n' "$SOURCE_BADGING" \
            | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          test "$ACTUAL_SOURCE_VERSION" = "$SOURCE_VERSION_CODE"
          test "$ACTUAL_SOURCE_VERSION" -lt "$CANDIDATE_VERSION"
          printf 'SOURCE_APK=%s\nCANDIDATE_APK=%s\nTEST_APK=%s\n' \
            "$SOURCE_APK" "$CANDIDATE/$APK_ASSET" "$CANDIDATE/upgrade-test.apk" >> "$GITHUB_ENV"
          printf 'PACKAGE_NAME=%s\nCANDIDATE_VERSION=%s\nFIXTURE_ID=%s\n' \
            "$PACKAGE_NAME" "$CANDIDATE_VERSION" "$FIXTURE_ID" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update SDK tools for minor-versioned preview packages
        if: matrix.channel != 'stable'
        run: ./scripts/ci/prepare-preview-sdk-tools.sh
      - name: Upgrade the exact production candidate on API ${{ matrix.api-level }}
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          channel: ${{ matrix.channel }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: adb start-server
          script: ./scripts/ci/run-upgrade-test.sh "$SOURCE_APK" "$CANDIDATE_APK" "$TEST_APK" "$PACKAGE_NAME" "$CANDIDATE_VERSION" "$FIXTURE_ID"

  current-upgrade:
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.package.result == 'success' && needs.package.outputs.already_published != 'true'
    needs: [package, release_scope]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 35
            target: google_apis
            arch: x86_64
            channel: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate
      - name: Validate candidate and the source pinned at release planning
        run: |
          set -euo pipefail
          CANDIDATE="$RUNNER_TEMP/release-candidate"
          PLAN="$CANDIDATE/release-plan.json"
          FIXTURE_ID=current-production
          FIXTURE="$CANDIDATE/current-upgrade/assets/current-production.json"
          SOURCE_APK_ASSET=$(jq -r .source.apkAsset "$FIXTURE")
          SOURCE_METADATA_ASSET=$(jq -r .source.metadataAsset "$FIXTURE")
          APK_ASSET=$(jq -r .apkAsset "$PLAN")
          METADATA_ASSET=$(jq -r .metadataAsset "$PLAN")
          PACKAGE_NAME=$(jq -r .packageName "$PLAN")
          CANDIDATE_VERSION=$(jq -r .versionCode "$PLAN")
          EXPECTED_SIGNER=$(jq -r .signerSha256 "$PLAN")
          BUILD_TOOLS=$(jq -r .androidBuildTools "$PLAN")
          python3 scripts/release/release_tool.py validate --plan "$PLAN" \
            --metadata "$CANDIDATE/$METADATA_ASSET" --apk "$CANDIDATE/$APK_ASSET"
          SOURCE_DIR="$CANDIDATE/current-upgrade/source"
          RELEASE_JSON="$SOURCE_DIR/release.json"
          TAG_REF_JSON="$SOURCE_DIR/tag-ref.json"
          SOURCE_APK="$SOURCE_DIR/$SOURCE_APK_ASSET"
          SOURCE_METADATA="$SOURCE_DIR/$SOURCE_METADATA_ASSET"
          python3 scripts/release/upgrade_fixture_tool.py verify-current-source \
            --fixture "$FIXTURE" --release-json "$RELEASE_JSON" \
            --tag-ref-json "$TAG_REF_JSON" --metadata "$SOURCE_METADATA" \
            --apk "$SOURCE_APK"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          for SIGNED_APK in "$SOURCE_APK" "$CANDIDATE/$APK_ASSET" "$CANDIDATE/upgrade-test.apk"; do
            "$APKSIGNER" verify --verbose "$SIGNED_APK"
            APK_CERT=$($APKSIGNER verify --print-certs "$SIGNED_APK" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | tr '[:upper:]' '[:lower:]')
            test "$APK_CERT" = "$EXPECTED_SIGNER"
          done
          SOURCE_VERSION_NAME=$(jq -r .source.versionName "$FIXTURE")
          SOURCE_VERSION_CODE=$(jq -r .source.versionCode "$FIXTURE")
          SOURCE_BADGING=$($AAPT dump badging "$SOURCE_APK" | sed -n '1p')
          case "$SOURCE_BADGING" in
            *"package: name='$PACKAGE_NAME'"*"versionCode='$SOURCE_VERSION_CODE'"*"versionName='$SOURCE_VERSION_NAME'"*) ;;
            *) echo "Unexpected fixture source package/version: $SOURCE_BADGING" >&2; exit 1 ;;
          esac
          ACTUAL_SOURCE_VERSION=$(printf '%s\n' "$SOURCE_BADGING" \
            | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          test "$ACTUAL_SOURCE_VERSION" = "$SOURCE_VERSION_CODE"
          test "$ACTUAL_SOURCE_VERSION" -lt "$CANDIDATE_VERSION"
          printf 'SOURCE_APK=%s\nCANDIDATE_APK=%s\nTEST_APK=%s\n' \
            "$SOURCE_APK" "$CANDIDATE/$APK_ASSET" "$CANDIDATE/upgrade-test.apk" >> "$GITHUB_ENV"
          printf 'PACKAGE_NAME=%s\nCANDIDATE_VERSION=%s\nFIXTURE_ID=%s\n' \
            "$PACKAGE_NAME" "$CANDIDATE_VERSION" "$FIXTURE_ID" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update SDK tools for minor-versioned preview packages
        if: matrix.channel != 'stable'
        run: ./scripts/ci/prepare-preview-sdk-tools.sh
      - name: Upgrade the exact production candidate on API ${{ matrix.api-level }}
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          channel: ${{ matrix.channel }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          pre-emulator-launch-script: adb start-server
          script: ./scripts/ci/run-upgrade-test.sh "$SOURCE_APK" "$CANDIDATE_APK" "$TEST_APK" "$PACKAGE_NAME" "$CANDIDATE_VERSION" "$FIXTURE_ID"

  publish:
    if: >-
      always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      needs.package.result == 'success' && needs.current-upgrade.result == 'success' &&
      ((needs.release_scope.outputs.historical_upgrades_required == 'true' && needs.upgrade.result == 'success') ||
       (needs.release_scope.outputs.historical_upgrades_required == 'false' && needs.upgrade.result == 'skipped')) &&
      needs.package.outputs.already_published != 'true'
    needs: [package, upgrade, current-upgrade, release_scope]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate
      - name: Require every selected signed upgrade result
        env:
          VERIFICATION_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/verification_gate.py publish
      - name: Resume, prove and publish the tested release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE="$RUNNER_TEMP/release-candidate"
          ARTIFACT_PLAN="$CANDIDATE/release-plan.json"
          RELEASES="$RUNNER_TEMP/releases.json"
          CURRENT_PLAN="$RUNNER_TEMP/current-release-plan.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'add' > "$RELEASES"
          python3 scripts/release/release_tool.py plan \
            --properties release/release.properties \
            --commit "$GITHUB_SHA" --releases "$RELEASES" --output "$CURRENT_PLAN"
          ACTION=$(jq -r .action "$CURRENT_PLAN")
          if [ "$ACTION" = already_published ]; then
            exit 0
          fi
          for FIELD in tag versionCode versionName packageName apkAsset metadataAsset signerSha256 commitSha; do
            test "$(jq -r ".$FIELD" "$CURRENT_PLAN")" = "$(jq -r ".$FIELD" "$ARTIFACT_PLAN")"
          done
          TAG=$(jq -r .tag "$ARTIFACT_PLAN")
          VERSION_NAME=$(jq -r .versionName "$ARTIFACT_PLAN")
          APK_ASSET=$(jq -r .apkAsset "$ARTIFACT_PLAN")
          METADATA_ASSET=$(jq -r .metadataAsset "$ARTIFACT_PLAN")
          python3 scripts/release/release_tool.py validate --plan "$ARTIFACT_PLAN" \
            --metadata "$CANDIDATE/$METADATA_ASSET" --apk "$CANDIDATE/$APK_ASSET"

          if [ "$ACTION" = create_draft ]; then
            TAG_REF="$RUNNER_TEMP/tag-ref.json"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$TAG_REF" 2>/dev/null; then
              python3 scripts/release/release_tool.py tag \
                --plan "$ARTIFACT_PLAN" --ref-json "$TAG_REF"
            fi
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Auto Secretary $VERSION_NAME" --generate-notes
          elif [ "$ACTION" != resume_draft ]; then
            echo "Unsupported release action: $ACTION" >&2
            exit 1
          fi

          gh release upload "$TAG" "$CANDIDATE/$APK_ASSET" \
            "$CANDIDATE/$METADATA_ASSET" --clobber
          PROOF="$RUNNER_TEMP/release-proof"
          mkdir -p "$PROOF"
          gh release download "$TAG" --dir "$PROOF" \
            --pattern "$APK_ASSET" --pattern "$METADATA_ASSET"
          python3 scripts/release/release_tool.py validate --plan "$ARTIFACT_PLAN" \
            --metadata "$PROOF/$METADATA_ASSET" --apk "$PROOF/$APK_ASSET"
          cmp "$CANDIDATE/$APK_ASSET" "$PROOF/$APK_ASSET"

          RELEASE_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          test -n "$RELEASE_ID"
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets")
          test "$(printf '%s' "$ASSETS" | jq 'length')" = 2
          printf '%s' "$ASSETS" | jq -e --arg apk "$APK_ASSET" --arg metadata "$METADATA_ASSET" \
            'map(.name) | sort == ([$apk, $metadata] | sort)'
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f draft=false -f prerelease=false -f make_latest=false >/dev/null
          TAG_PREFIX=$(jq -r .tagPrefix "$ARTIFACT_PLAN")
          HIGHEST_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -s --arg prefix "$TAG_PREFIX" \
              '[.[][] | select(.draft == false and .prerelease == false)
                | select(.tag_name | startswith($prefix))
                | . + {versionCode:(try (.tag_name | ltrimstr($prefix) | tonumber) catch null)}
                | select(.versionCode != null)] | max_by(.versionCode).id')
          test -n "$HIGHEST_ID"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$HIGHEST_ID" \
            -f make_latest=true >/dev/null
