name: Verify and publish Android app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.sha }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Test release contract tool
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - name: Compile, unit tests, goldens, lint and APKs
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest assembleRelease
      - name: Enforce compact install artifacts
        run: |
          test "$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)" -lt 5242880
          test "$(du -cb app/src/main/res/font/*.ttf | tail -1 | cut -f1)" -lt 1677722
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: quality-reports-and-apks
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release-unsigned.apk

  instrumentation:
    needs: quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
            arch: x86_64
          - api-level: 35
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumentation and migration tests on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest

  pr-gate:
    name: pull-request-gate
    if: always() && github.event_name == 'pull_request'
    needs: [quality, instrumentation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every pull-request quality job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          INSTRUMENTATION_RESULT: ${{ needs.instrumentation.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$INSTRUMENTATION_RESULT" = success

  package:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality, instrumentation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      already_published: ${{ steps.plan.outputs.already_published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4733eaac7c1b0da527e4206b7671e0061de1ce37 # v6
      - name: Determine or resume the release plan
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASES="$RUNNER_TEMP/releases.json"
          PLAN="$RUNNER_TEMP/release-plan.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'add' > "$RELEASES"
          python3 scripts/release/release_tool.py plan \
            --properties release/release.properties \
            --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --commit "$GITHUB_SHA" --releases "$RELEASES" --output "$PLAN"
          ACTION=$(jq -r .action "$PLAN")
          if [ "$ACTION" = already_published ]; then
            printf 'already_published=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'already_published=false\n' >> "$GITHUB_OUTPUT"
          fi
          printf 'PLAN=%s\n' "$PLAN" >> "$GITHUB_ENV"
          printf 'VERSION_CODE=%s\n' "$(jq -r .versionCode "$PLAN")" >> "$GITHUB_ENV"
          printf 'VERSION_NAME=%s\n' "$(jq -r .versionName "$PLAN")" >> "$GITHUB_ENV"
          printf 'APK_ASSET=%s\n' "$(jq -r .apkAsset "$PLAN")" >> "$GITHUB_ENV"
          printf 'METADATA_ASSET=%s\n' "$(jq -r .metadataAsset "$PLAN")" >> "$GITHUB_ENV"
          printf 'EXPECTED_SIGNER=%s\n' "$(jq -r .signerSha256 "$PLAN")" >> "$GITHUB_ENV"
          printf 'ANDROID_BUILD_TOOLS=%s\n' "$(jq -r .androidBuildTools "$PLAN")" >> "$GITHUB_ENV"
      - name: Build, sign and validate the production candidate once
        if: steps.plan.outputs.already_published != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS || 'release' }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_PASSWORD"
          KEYSTORE="$RUNNER_TEMP/autosecretary.jks"
          trap 'rm -f "$KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          ACTUAL_CERT=$(keytool -list -v -keystore "$KEYSTORE" \
            -storepass "$SIGNING_STORE_PASSWORD" -alias "$SIGNING_KEY_ALIAS" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL_CERT" = "$EXPECTED_SIGNER"
          export SIGNING_STORE_FILE="$KEYSTORE"
          ./gradlew assembleRelease assembleDebugAndroidTest \
            -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" \
            -PrequireReleaseSigning=true
          CANDIDATE="$RUNNER_TEMP/release-candidate"
          mkdir -p "$CANDIDATE"
          cp app/build/outputs/apk/release/app-release.apk "$CANDIDATE/$APK_ASSET"
          APKSIGNER="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS/aapt"
          "$APKSIGNER" sign --ks "$KEYSTORE" --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$CANDIDATE/upgrade-test.apk" \
            app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          for SIGNED_APK in "$CANDIDATE/$APK_ASSET" "$CANDIDATE/upgrade-test.apk"; do
            "$APKSIGNER" verify --verbose "$SIGNED_APK"
            APK_CERT=$($APKSIGNER verify --print-certs "$SIGNED_APK" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | tr '[:upper:]' '[:lower:]')
            test "$APK_CERT" = "$EXPECTED_SIGNER"
          done
          BADGING=$($AAPT dump badging "$CANDIDATE/$APK_ASSET" | sed -n '1p')
          PACKAGE_NAME=$(jq -r .packageName "$PLAN")
          case "$BADGING" in
            *"package: name='$PACKAGE_NAME'"*"versionCode='$VERSION_CODE'"*"versionName='$VERSION_NAME'"*) ;;
            *) echo "Unexpected package/version: $BADGING" >&2; exit 1 ;;
          esac
          cp "$PLAN" "$CANDIDATE/release-plan.json"
          python3 scripts/release/release_tool.py metadata --plan "$PLAN" \
            --apk "$CANDIDATE/$APK_ASSET" --output "$CANDIDATE/$METADATA_ASSET"
          python3 scripts/release/release_tool.py validate --plan "$PLAN" \
            --metadata "$CANDIDATE/$METADATA_ASSET" --apk "$CANDIDATE/$APK_ASSET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: steps.plan.outputs.already_published != 'true'
        with:
          name: production-release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate/
          compression-level: 0
          retention-days: 2
          if-no-files-found: error

  upgrade:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.package.outputs.already_published != 'true'
    needs: [instrumentation, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 26
            target: default
            arch: x86_64
          - api-level: 35
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate
      - name: Validate candidate and fetch the previous production APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE="$RUNNER_TEMP/release-candidate"
          PLAN="$CANDIDATE/release-plan.json"
          RELEASES="$RUNNER_TEMP/releases.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'add' > "$RELEASES"
          PREVIOUS_TAG=$(python3 scripts/release/release_tool.py previous \
            --plan "$PLAN" --releases "$RELEASES")
          APK_ASSET=$(jq -r .apkAsset "$PLAN")
          METADATA_ASSET=$(jq -r .metadataAsset "$PLAN")
          PACKAGE_NAME=$(jq -r .packageName "$PLAN")
          CANDIDATE_VERSION=$(jq -r .versionCode "$PLAN")
          EXPECTED_SIGNER=$(jq -r .signerSha256 "$PLAN")
          BUILD_TOOLS=$(jq -r .androidBuildTools "$PLAN")
          python3 scripts/release/release_tool.py validate --plan "$PLAN" \
            --metadata "$CANDIDATE/$METADATA_ASSET" --apk "$CANDIDATE/$APK_ASSET"
          PREVIOUS_DIR="$RUNNER_TEMP/previous-release"
          mkdir -p "$PREVIOUS_DIR"
          gh release download "$PREVIOUS_TAG" --dir "$PREVIOUS_DIR" --pattern "$APK_ASSET"
          PREVIOUS_APK="$PREVIOUS_DIR/$APK_ASSET"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          for SIGNED_APK in "$PREVIOUS_APK" "$CANDIDATE/$APK_ASSET" "$CANDIDATE/upgrade-test.apk"; do
            "$APKSIGNER" verify --verbose "$SIGNED_APK"
            APK_CERT=$($APKSIGNER verify --print-certs "$SIGNED_APK" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | tr '[:upper:]' '[:lower:]')
            test "$APK_CERT" = "$EXPECTED_SIGNER"
          done
          PREVIOUS_BADGING=$($AAPT dump badging "$PREVIOUS_APK" | sed -n '1p')
          case "$PREVIOUS_BADGING" in *"package: name='$PACKAGE_NAME'"*) ;; *) exit 1 ;; esac
          PREVIOUS_VERSION=$(printf '%s\n' "$PREVIOUS_BADGING" \
            | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          test -n "$PREVIOUS_VERSION"
          test "$PREVIOUS_VERSION" -lt "$CANDIDATE_VERSION"
          printf 'PREVIOUS_APK=%s\nCANDIDATE_APK=%s\nTEST_APK=%s\n' \
            "$PREVIOUS_APK" "$CANDIDATE/$APK_ASSET" "$CANDIDATE/upgrade-test.apk" >> "$GITHUB_ENV"
          printf 'PACKAGE_NAME=%s\nCANDIDATE_VERSION=%s\n' \
            "$PACKAGE_NAME" "$CANDIDATE_VERSION" >> "$GITHUB_ENV"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Upgrade the exact production candidate on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./scripts/ci/run-upgrade-test.sh "$PREVIOUS_APK" "$CANDIDATE_APK" "$TEST_APK" "$PACKAGE_NAME" "$CANDIDATE_VERSION"

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.package.outputs.already_published != 'true'
    needs: [package, upgrade]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: production-release-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-candidate
      - name: Resume, prove and publish the tested release candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CANDIDATE="$RUNNER_TEMP/release-candidate"
          ARTIFACT_PLAN="$CANDIDATE/release-plan.json"
          RELEASES="$RUNNER_TEMP/releases.json"
          CURRENT_PLAN="$RUNNER_TEMP/current-release-plan.json"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" | jq -s 'add' > "$RELEASES"
          python3 scripts/release/release_tool.py plan \
            --properties release/release.properties \
            --run-number "$GITHUB_RUN_NUMBER" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --commit "$GITHUB_SHA" --releases "$RELEASES" --output "$CURRENT_PLAN"
          ACTION=$(jq -r .action "$CURRENT_PLAN")
          if [ "$ACTION" = already_published ]; then
            exit 0
          fi
          for FIELD in tag versionCode versionName packageName apkAsset metadataAsset signerSha256 commitSha; do
            test "$(jq -r ".$FIELD" "$CURRENT_PLAN")" = "$(jq -r ".$FIELD" "$ARTIFACT_PLAN")"
          done
          TAG=$(jq -r .tag "$ARTIFACT_PLAN")
          VERSION_NAME=$(jq -r .versionName "$ARTIFACT_PLAN")
          APK_ASSET=$(jq -r .apkAsset "$ARTIFACT_PLAN")
          METADATA_ASSET=$(jq -r .metadataAsset "$ARTIFACT_PLAN")
          python3 scripts/release/release_tool.py validate --plan "$ARTIFACT_PLAN" \
            --metadata "$CANDIDATE/$METADATA_ASSET" --apk "$CANDIDATE/$APK_ASSET"

          if [ "$ACTION" = create_draft ]; then
            TAG_REF="$RUNNER_TEMP/tag-ref.json"
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > "$TAG_REF" 2>/dev/null; then
              python3 scripts/release/release_tool.py tag \
                --plan "$ARTIFACT_PLAN" --ref-json "$TAG_REF"
            fi
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Auto Secretary $VERSION_NAME" --generate-notes
          elif [ "$ACTION" != resume_draft ]; then
            echo "Unsupported release action: $ACTION" >&2
            exit 1
          fi

          gh release upload "$TAG" "$CANDIDATE/$APK_ASSET" \
            "$CANDIDATE/$METADATA_ASSET" --clobber
          PROOF="$RUNNER_TEMP/release-proof"
          mkdir -p "$PROOF"
          gh release download "$TAG" --dir "$PROOF" \
            --pattern "$APK_ASSET" --pattern "$METADATA_ASSET"
          python3 scripts/release/release_tool.py validate --plan "$ARTIFACT_PLAN" \
            --metadata "$PROOF/$METADATA_ASSET" --apk "$PROOF/$APK_ASSET"
          cmp "$CANDIDATE/$APK_ASSET" "$PROOF/$APK_ASSET"

          RELEASE_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | head -n 1)
          test -n "$RELEASE_ID"
          ASSETS=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets")
          test "$(printf '%s' "$ASSETS" | jq 'length')" = 2
          printf '%s' "$ASSETS" | jq -e --arg apk "$APK_ASSET" --arg metadata "$METADATA_ASSET" \
            'map(.name) | sort == ([$apk, $metadata] | sort)'
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -f draft=false -f prerelease=false -f make_latest=false >/dev/null
          TAG_PREFIX=$(jq -r .tagPrefix "$ARTIFACT_PLAN")
          HIGHEST_ID=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -s --arg prefix "$TAG_PREFIX" \
              '[.[][] | select(.draft == false and .prerelease == false)
                | select(.tag_name | startswith($prefix))
                | . + {versionCode:(try (.tag_name | ltrimstr($prefix) | tonumber) catch null)}
                | select(.versionCode != null)] | max_by(.versionCode).id')
          test -n "$HIGHEST_ID"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$HIGHEST_ID" \
            -f make_latest=true >/dev/null
