name: Android test APK

on:
  push:
    branches:
      - "codex/**"
      - "agent/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew checkArchitecture assembleDebug
      - name: Stage APK
        run: cp build/outputs/apk/debug/AutoSecretary.apk AutoSecretary.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSecretary-${{ github.run_id }}
          path: AutoSecretary.apk
          if-no-files-found: error
      - name: Publish phone-test prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_TAG: test-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          gh release create "$TEST_TAG" AutoSecretary.apk
          --title "Auto Secretary phone test ${{ github.run_number }}"
          --notes "Automated test APK for commit ${{ github.sha }}"
          --prerelease
