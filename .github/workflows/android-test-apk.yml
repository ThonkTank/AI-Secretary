name: Android test APK

on:
  push:
    branches:
      - "codex/**"
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI_VERSION_CODE: 100${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: >-
          ./gradlew checkArchitecture assembleDebug
          -PciVersionCode="$CI_VERSION_CODE"
          -PpreviewApplicationId=com.autosecretary.preview
      - name: Stage APK
        run: |
          cp build/outputs/apk/debug/AutoSecretary.apk AutoSecretary.apk
          printf '%s' "$CI_VERSION_CODE" > version.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSecretary-${{ github.run_id }}
          path: AutoSecretary.apk
          if-no-files-found: error
      - name: Publish latest phone-test release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "preview-$CI_VERSION_CODE"
          AutoSecretary.apk version.txt
          --title "Auto Secretary Preview $CI_VERSION_CODE"
          --notes "Automated test APK for commit ${{ github.sha }}"
          --latest
