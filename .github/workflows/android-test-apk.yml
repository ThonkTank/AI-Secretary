name: Android test APK

on:
  push:
    branches:
      - "codex/**"
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: ./gradlew checkArchitecture lintDevDebug assembleDevDebug
      - name: Stage APK
        run: |
          APK=build/outputs/apk/dev/debug/AutoSecretary-devDebug.apk
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          EXPECTED_CODE=$((1000000 + $(sed -n 's/^VERSION_CODE=//p' version.properties)))
          EXPECTED_NAME="$(sed -n 's/^VERSION_NAME=//p' version.properties)-preview"
          BADGING=$("$AAPT" dump badging "$APK" | sed -n '1p')
          case "$BADGING" in
            *"package: name='com.autosecretary.preview'"*"versionCode='$EXPECTED_CODE'"*"versionName='$EXPECTED_NAME'"*) ;;
            *) echo "Unexpected preview package/version: $BADGING" >&2; exit 1;;
          esac
          cp "$APK" AutoSecretary-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AutoSecretary-${{ github.run_id }}
          path: AutoSecretary-preview.apk
          if-no-files-found: error
  publish-prerelease:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AutoSecretary-${{ github.run_id }}
      - name: Publish an explicitly non-production prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="preview-${{ github.run_id }}"
          gh release create "$TAG" AutoSecretary-preview.apk \
            --title "Auto Secretary Preview ${{ github.run_id }}" \
            --prerelease \
            --target "${{ github.sha }}"
