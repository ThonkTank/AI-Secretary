name: Android upgrade-gate APKs

on:
  workflow_dispatch:
    inputs:
      signing_identity:
        description: Sign both short-lived gate APKs with the selected permanent identity
        required: true
        default: fallback
        type: choice
        options:
          - build4
          - fallback

permissions:
  contents: read

concurrency:
  group: android-upgrade-gate-${{ inputs.signing_identity }}
  cancel-in-progress: false

jobs:
  build-gate-apks:
    runs-on: ubuntu-latest
    env:
      BUILD4_CERT_SHA256: 1e0e90509d79efacebaec1af024f2577d7799cf5534e841db7417184287dbfb2
      FALLBACK_CERT_SHA256: 79eb85409ede6aa014b125dd6190206c9809f0b948a5f92342a99376f81d0fef
      BUILD4_KEYSTORE_BASE64: ${{ secrets.PRODUCTION_KEYSTORE_BASE64 }}
      BUILD4_STORE_PASSWORD: ${{ secrets.PRODUCTION_STORE_PASSWORD }}
      BUILD4_KEY_ALIAS: ${{ secrets.PRODUCTION_KEY_ALIAS }}
      BUILD4_KEY_PASSWORD: ${{ secrets.PRODUCTION_KEY_PASSWORD }}
      FALLBACK_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      FALLBACK_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: .gradle/bundled-ai
          key: bundled-ai-gemma3-270m-q8-0f7147f1
      - name: Restore selected permanent keystore
        env:
          SIGNING_IDENTITY: ${{ inputs.signing_identity }}
        run: |
          if [ "$SIGNING_IDENTITY" = "build4" ]; then
            KEYSTORE_BASE64="$BUILD4_KEYSTORE_BASE64"
            STORE_PASSWORD="$BUILD4_STORE_PASSWORD"
            KEY_ALIAS="$BUILD4_KEY_ALIAS"
            KEY_PASSWORD="$BUILD4_KEY_PASSWORD"
            EXPECTED_CERT="$BUILD4_CERT_SHA256"
          else
            KEYSTORE_BASE64="$FALLBACK_KEYSTORE_BASE64"
            STORE_PASSWORD="$FALLBACK_STORE_PASSWORD"
            KEY_ALIAS="release"
            KEY_PASSWORD="$FALLBACK_STORE_PASSWORD"
            EXPECTED_CERT="$FALLBACK_CERT_SHA256"
          fi
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/production.jks"
          chmod 600 "$RUNNER_TEMP/production.jks"
          printf 'PRODUCTION_STORE_PASSWORD=%s\n' "$STORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'PRODUCTION_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'PRODUCTION_KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> "$GITHUB_ENV"
          printf 'EXPECTED_CERT_SHA256=%s\n' "$EXPECTED_CERT" >> "$GITHUB_ENV"
      - name: Verify the checked-in first target
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(sed -n 's/^VERSION_CODE=//p' version.properties)" = "6"
          test "$(sed -n 's/^VERSION_NAME=//p' version.properties)" = "2.0.0"
      - name: Test and build the code-6 gate APK
        env:
          PRODUCTION_KEYSTORE: ${{ runner.temp }}/production.jks
        run: >-
          ./gradlew --no-daemon --max-workers=1
          checkArchitecture lintDevDebug lintFullRelease
          compileFullDebugAndroidTestJavaWithJavac assembleFullRelease
          -PrequireProductionSigning=true
      - name: Stage the code-6 gate APK
        run: cp build/outputs/apk/full/release/AutoSecretary.apk "$RUNNER_TEMP/AutoSecretary-v2.0.0-code6.apk"
      - name: Build the ephemeral code-7 update APK
        env:
          PRODUCTION_KEYSTORE: ${{ runner.temp }}/production.jks
        run: |
          sed -i 's/^VERSION_CODE=.*/VERSION_CODE=7/' version.properties
          sed -i 's/^VERSION_NAME=.*/VERSION_NAME=2.0.1/' version.properties
          ./gradlew --no-daemon --max-workers=1 clean assembleFullRelease \
            -PrequireProductionSigning=true
          cp build/outputs/apk/full/release/AutoSecretary.apk \
            "$RUNNER_TEMP/AutoSecretary-v2.0.1-code7.apk"
      - name: Verify both packages, versions and signers
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          verify_apk() {
            apk="$1"
            expected_code="$2"
            expected_name="$3"
            "$APKSIGNER" verify --verbose "$apk"
            actual_cert=$("$APKSIGNER" verify --print-certs "$apk" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | tr '[:upper:]' '[:lower:]')
            test "$actual_cert" = "$EXPECTED_CERT_SHA256"
            badging=$("$AAPT" dump badging "$apk" | sed -n '1p')
            case "$badging" in
              *"package: name='com.autosecretary'"*"versionCode='$expected_code'"*"versionName='$expected_name'"*) ;;
              *) echo "Unexpected package/version: $badging" >&2; exit 1;;
            esac
          }
          verify_apk "$RUNNER_TEMP/AutoSecretary-v2.0.0-code6.apk" 6 2.0.0
          verify_apk "$RUNNER_TEMP/AutoSecretary-v2.0.1-code7.apk" 7 2.0.1
          cd "$RUNNER_TEMP"
          sha256sum AutoSecretary-v2.0.0-code6.apk AutoSecretary-v2.0.1-code7.apk \
            > upgrade-gate-apks.sha256
          printf '%s\n' "$EXPECTED_CERT_SHA256" > signer-sha256.txt
      - name: Upload short-lived gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-gate-${{ inputs.signing_identity }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/AutoSecretary-v2.0.0-code6.apk
            ${{ runner.temp }}/AutoSecretary-v2.0.1-code7.apk
            ${{ runner.temp }}/upgrade-gate-apks.sha256
            ${{ runner.temp }}/signer-sha256.txt
          retention-days: 1
          if-no-files-found: error
