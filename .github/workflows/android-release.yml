name: Android build and release

on:
  push:
    branches:
      - "agent/**"
      - "codex/**"
  workflow_dispatch:
    inputs:
      stable:
        description: Publish a stable release (allowed only from main)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-build-and-release
  cancel-in-progress: false

jobs:
  build-test-sign-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPECTED_CERT_SHA256: 1e0e90509d79efacebaec1af024f2577d7799cf5534e841db7417184287dbfb2
      KEYSTORE_BASE64: ${{ secrets.PRODUCTION_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.PRODUCTION_STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.PRODUCTION_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.PRODUCTION_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: .gradle/bundled-ai
          key: bundled-ai-gemma3-270m-q8-0f7147f1

      - name: Choose the one monotonic Android version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="2.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          LATEST_CODE=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            | jq -s '[.[][] | .tag_name | select(startswith("android-")) | ltrimstr("android-") | tonumber] | max // 0')
          VERSION_FLOOR=$((2000000 + GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))
          VERSION_CODE=$((VERSION_FLOOR > LATEST_CODE ? VERSION_FLOOR : LATEST_CODE + 1))
          printf 'VERSION_CODE=%s\nVERSION_NAME=%s\n' "$VERSION_CODE" "$VERSION_NAME" \
            >> "$GITHUB_ENV"

      - name: Restore the permanent signing key
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' \
            | base64 --decode > "$RUNNER_TEMP/autosecretary.jks"
          chmod 600 "$RUNNER_TEMP/autosecretary.jks"
          printf 'PRODUCTION_KEYSTORE=%s\n' "$RUNNER_TEMP/autosecretary.jks" >> "$GITHUB_ENV"
          printf 'PRODUCTION_STORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'PRODUCTION_KEY_ALIAS=%s\n' "$KEY_ALIAS" >> "$GITHUB_ENV"
          printf 'PRODUCTION_KEY_PASSWORD=%s\n' "$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test, lint and build the model-complete APK
        run: >-
          ./gradlew --no-daemon --max-workers=1
          checkArchitecture lintDebug lintRelease assembleDebugAndroidTest assembleRelease
          -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
          -PrequireProductionSigning=true

      - name: Verify package, version, model and signature
        run: |
          APK=build/outputs/apk/release/AutoSecretary.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/models/autosecretary-gemma3-270m-it-q8.task'
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL_CERT" = "$EXPECTED_CERT_SHA256"
          BADGING=$("$AAPT" dump badging "$APK" | sed -n '1p')
          case "$BADGING" in
            *"package: name='com.autosecretary'"*"versionCode='$VERSION_CODE'"*"versionName='$VERSION_NAME'"*) ;;
            *) echo "Unexpected package/version: $BADGING" >&2; exit 1 ;;
          esac

      - name: Create release assets
        run: |
          cp build/outputs/apk/release/AutoSecretary.apk AutoSecretary.apk
          SHA256=$(sha256sum AutoSecretary.apk | awk '{print $1}')
          printf '%s  AutoSecretary.apk\n' "$SHA256" > AutoSecretary.apk.sha256
          printf 'versionCode=%s\nversionName=%s\npackageName=com.autosecretary\n' \
            "$VERSION_CODE" "$VERSION_NAME" > version.txt
          printf '%s\n' "$EXPECTED_CERT_SHA256" > signer-sha256.txt
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg packageName com.autosecretary \
            --arg apkAsset AutoSecretary.apk \
            --arg sha256 "$SHA256" \
            --arg signerSha256 "$EXPECTED_CERT_SHA256" \
            '{versionCode:$versionCode,versionName:$versionName,packageName:$packageName,apkAsset:$apkAsset,sha256:$sha256,signerSha256:$signerSha256}' \
            > release-metadata.json
          sha256sum -c AutoSecretary.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: AutoSecretary-${{ env.VERSION_CODE }}
          path: |
            AutoSecretary.apk
            AutoSecretary.apk.sha256
            release-metadata.json
            version.txt
            signer-sha256.txt
          if-no-files-found: error

      - name: Publish the build
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ inputs.stable }}
        run: |
          TAG="android-$VERSION_CODE"
          ASSETS=(AutoSecretary.apk AutoSecretary.apk.sha256 release-metadata.json version.txt signer-sha256.txt)
          if [[ "$GITHUB_EVENT_NAME" = workflow_dispatch && "$STABLE" = true ]]; then
            test "$GITHUB_REF" = refs/heads/main
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Auto Secretary $VERSION_NAME" --generate-notes --latest
          else
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "Auto Secretary $VERSION_NAME (Test)" --generate-notes --prerelease
          fi
