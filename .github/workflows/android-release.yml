name: Publish phone update

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-phone-update
  cancel-in-progress: false

jobs:
  build-test-sign-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      EXPECTED_CERT_SHA256: de45d94c9724beeaa2e0dff31f69f53bb0f4c9ba79a5aa419d1f29d18f4d91da
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/cache@v4
        with:
          path: .gradle/bundled-ai
          key: bundled-ai-gemma3-270m-q8-0f7147f1

      - name: Choose the monotonic Android version
        run: |
          test "$GITHUB_RUN_ATTEMPT" -lt 100
          VERSION_NAME="2.0.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          VERSION_CODE=$((2000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          test "$VERSION_CODE" -le 2100000000
          printf 'VERSION_CODE=%s\nVERSION_NAME=%s\n' "$VERSION_CODE" "$VERSION_NAME" \
            >> "$GITHUB_ENV"

      - name: Restore the permanent signing key
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' \
            | base64 --decode > "$RUNNER_TEMP/autosecretary.jks"
          chmod 600 "$RUNNER_TEMP/autosecretary.jks"
          printf 'PRODUCTION_KEYSTORE=%s\n' "$RUNNER_TEMP/autosecretary.jks" >> "$GITHUB_ENV"
          printf 'PRODUCTION_STORE_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          printf 'PRODUCTION_KEY_ALIAS=release\n' >> "$GITHUB_ENV"
          printf 'PRODUCTION_KEY_PASSWORD=%s\n' "$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: Test, lint and build the model-complete APK
        run: >-
          ./gradlew --no-daemon --max-workers=1
          checkArchitecture lintDebug lintRelease assembleDebugAndroidTest assembleRelease
          -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME
          -PrequireProductionSigning=true

      - name: Verify package, version, model and signature
        run: |
          APK=build/outputs/apk/release/AutoSecretary.apk
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -f "$APK"
          unzip -l "$APK" | grep -q 'assets/models/autosecretary-gemma3-270m-it-q8.task'
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL_CERT=$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr '[:upper:]' '[:lower:]')
          test "$ACTUAL_CERT" = "$EXPECTED_CERT_SHA256"
          BADGING=$("$AAPT" dump badging "$APK" | sed -n '1p')
          case "$BADGING" in
            *"package: name='com.autosecretary'"*"versionCode='$VERSION_CODE'"*"versionName='$VERSION_NAME'"*) ;;
            *) echo "Unexpected package/version: $BADGING" >&2; exit 1 ;;
          esac

      - name: Create the updater assets
        run: |
          cp build/outputs/apk/release/AutoSecretary.apk AutoSecretary.apk
          SHA256=$(sha256sum AutoSecretary.apk | awk '{print $1}')
          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg packageName com.autosecretary \
            --arg apkAsset AutoSecretary.apk \
            --arg sha256 "$SHA256" \
            --arg signerSha256 "$EXPECTED_CERT_SHA256" \
            '{versionCode:$versionCode,versionName:$versionName,packageName:$packageName,apkAsset:$apkAsset,sha256:$sha256,signerSha256:$signerSha256}' \
            > release-metadata.json

      - name: Publish the latest phone update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-$VERSION_CODE"
          gh release create "$TAG" AutoSecretary.apk release-metadata.json \
            --target "$GITHUB_SHA" \
            --title "Auto Secretary $VERSION_NAME" --generate-notes --latest
