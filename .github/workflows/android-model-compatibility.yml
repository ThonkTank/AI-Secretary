name: Android-Modell-Kompatibilität

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/assets/model-manifest.json"
      - "app/src/androidTest/**"
      - "infrastructure/src/main/java/com/autosecretary/ai/**"
      - "infrastructure/src/main/java/com/autosecretary/platform/model/**"
      - "infrastructure/build.gradle.kts"
      - ".github/workflows/android-model-compatibility.yml"
      - "gradle/**"
      - "gradlew"

permissions:
  contents: read

concurrency:
  group: android-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-model:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: arm64-v8a
          target: google_apis
          disk-size: 4096M
          ram-size: 4096M
          heap-size: 2048M
          emulator-boot-timeout: 1200
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
            -accel off -no-metrics
          disable-animations: true
          script: >-
            ./gradlew --no-daemon --max-workers=1 modelCompatibilityTest
            -Pandroid.testInstrumentationRunnerArguments.annotation=androidx.test.filters.LargeTest
