name: Android-Modell-Kompatibilität

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/assets/model-manifest.json"
      - "app/src/androidTest/**"
      - "infrastructure/src/main/java/com/autosecretary/ai/**"
      - "infrastructure/src/main/java/com/autosecretary/platform/model/**"
      - "infrastructure/build.gradle.kts"
      - "gradle/**"
      - "gradlew"

permissions:
  contents: read

concurrency:
  group: android-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-model:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disk-size: 4096M
          heap-size: 2048M
          disable-animations: true
          script: >-
            ./gradlew --no-daemon --max-workers=1 :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.annotation=androidx.test.filters.LargeTest
