name: Android-Modell-Kompatibilität

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/src/main/assets/model-manifest.json"
      - "app/src/androidTest/**"
      - "infrastructure/src/main/java/com/autosecretary/ai/**"
      - "infrastructure/src/main/java/com/autosecretary/platform/model/**"
      - "infrastructure/build.gradle.kts"
      - ".github/workflows/android-model-compatibility.yml"
      - "gradle/**"
      - "gradlew"

permissions:
  contents: read

concurrency:
  group: android-model-${{ github.ref }}
  cancel-in-progress: true

jobs:
  artifact-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Verify pinned model bytes and compile the device suite
        run: >-
          ./gradlew --no-daemon --max-workers=1 verifyModelArtifact
          :app:assembleDebugAndroidTest

  real-model-on-physical-device:
    if: ${{ vars.AUTOSECRETARY_MODEL_DEVICE_RUNNER == 'enabled' }}
    needs: artifact-contract
    runs-on: [self-hosted, linux, autosecretary-android-device]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@4c125117fe7c5aed11272ec4213f602f012f89f2 # v5
      - name: Require exactly one authorized physical device
        run: test "$(adb devices | awk 'NR > 1 && $2 == "device" { count++ } END { print count + 0 }')" -eq 1
      - name: Run real MediaPipe inference and German evaluation suite
        run: >-
          ./gradlew --no-daemon --max-workers=1 modelCompatibilityTest
          -Pandroid.testInstrumentationRunnerArguments.annotation=androidx.test.filters.LargeTest
