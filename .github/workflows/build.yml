name: Build and Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2

      - name: Install build tools
        run: |
          sdkmanager "platforms;android-33"
          sdkmanager "build-tools;33.0.2"

      - name: Compile resources
        run: |
          mkdir -p compiled_res
          ${ANDROID_SDK_ROOT}/build-tools/33.0.2/aapt2 compile \
            res/values/strings.xml \
            -o compiled_res/

      - name: Link resources
        run: |
          mkdir -p build/gen
          ${ANDROID_SDK_ROOT}/build-tools/33.0.2/aapt2 link \
            -I ${ANDROID_SDK_ROOT}/platforms/android-33/android.jar \
            --manifest AndroidManifest.xml \
            -o build/app.apk \
            --java build/gen \
            compiled_res/*.flat

      - name: Compile Java
        run: |
          mkdir -p build/obj
          javac -source 8 -target 8 \
            -d build/obj \
            -classpath ${ANDROID_SDK_ROOT}/platforms/android-33/android.jar \
            -sourcepath src \
            src/com/secretary/MainActivity.java \
            build/gen/com/secretary/R.java

      - name: Create DEX
        run: |
          ${ANDROID_SDK_ROOT}/build-tools/33.0.2/d8 \
            --lib ${ANDROID_SDK_ROOT}/platforms/android-33/android.jar \
            --output build/ \
            build/obj/com/secretary/*.class

      - name: Add DEX to APK
        run: |
          cd build
          zip -u app.apk classes.dex
          cd ..

      - name: Align APK
        run: |
          ${ANDROID_SDK_ROOT}/build-tools/33.0.2/zipalign -f 4 \
            build/app.apk build/app_aligned.apk

      - name: Sign APK
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=AI Secretary, OU=Dev, O=ThonkTank, L=Unknown, ST=Unknown, C=US"

          ${ANDROID_SDK_ROOT}/build-tools/33.0.2/apksigner sign \
            --ks release.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out app-signed.apk \
            build/app_aligned.apk

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: app-signed.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
