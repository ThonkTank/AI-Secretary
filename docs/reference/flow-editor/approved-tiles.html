<script>

function proposal(target,kind){if(!move||target===move.id)return null;const g=clone(graph),ids=move.kind==='branch'?branch(move.id):[move.id];if(ids.includes(target))return null;
 if(move.kind==='link'){if(outs(move.id,g).some(e=>e.b===target)||reaches(target,move.id,g))return null;g.edges.push(edge(move.id,target));g.starts=g.starts.filter(s=>!s.roots.includes(target));return valid(g)?clean(g):null;}

function sheetHtml(){tick();const actions=runs.flatMap(r=>available(r).map(id=>({r,id}))),starts=saved.starts.filter(s=>fits(needs(saved,s.roots,reachable(s.roots,saved)))&&!runs.some(r=>r.label===startName(s,saved))),collect=runs.filter(r=>done(r)&&!r.collected),waits=runs.flatMap(r=>r.waits.filter(w=>!w.done).map(w=>({r,w})));const confirms=waits.filter(({w})=>w.confirm&&clock>=w.until);const has=starts.length||actions.length||collect.length||confirms.length;
const waitHtml=waits.map(({r,w})=>`<div class="fg-wait">${icon('clock-3')}<button data-action="wait" data-id="${r.id}" data-wait="${w.id}">${esc(r.label)}: ${esc(name(w.b,r.g))}<br>${clock>=w.until?'Wartezeit vorbei':`noch ${fmt(w.until-clock)}`}</button></div>`).join('');
let content=question?questionHtml():page==='all'?`<h2>Alles</h2><button class="fg-leaf" style="width:100%;justify-content:space-between" data-action="edit">${esc(saved.name)} ${icon('pencil')}</button>${waitHtml}${runs.filter(r=>!r.collected).map(r=>`<p class="fg-meta">${esc(r.label)} · ${available(r).length} verfügbar</p>`).join('')}`:later?`<h2>Heute</h2><section class="fg-leaf"><h3>Zähne putzen</h3>${row('Zähne putzen','other','','2 Min.')}<div class="fg-footer"><button data-action="return-sheet">Später</button></div></section>`:has?`<h2>Heute</h2><section class="fg-leaf"><h3>${esc(saved.name)}</h3>${starts.map(s=>row(startName(s,saved),'start',s.id)).join('')}${actions.map(({r,id})=>{const isLast=r.ids.filter(i=>r.state[i]==='pending').length===1&&!r.waits.some(w=>!w.done)&&!waitEdges(r,id).some(e=>e.h||e.confirm);return row(r.label+': '+name(id,r.g),'act',r.id,isLast?`${r.earned+node(id,r.g).tau} Tau`:'',id);}).join('')}${confirms.map(({r,w})=>row(r.label+': Wartezeit bestätigen','confirm',r.id,'',w.id)).join('')}${collect.map(r=>row(r.label+': Abschließen','collect',r.id,`${r.earned} Tau`)).join('')}${waitHtml}<div class="fg-footer"><button data-action="later">Später</button></div></section>`:`<h2>Heute</h2><section class="fg-leaf"><h3>Zähne putzen</h3>${row('Zähne putzen','other','','2 Min.')}</section>`;
return `<div class="fg-top"><span class="fg-meta">${esc(saved.name)}</span><button data-action="edit" aria-label="Ablauf bearbeiten">${icon('pencil')}</button></div>${content}<div class="fg-notice" role="status">${esc(notice)}</div><nav class="fg-tabs" aria-label="App"><button data-action="today" aria-pressed="${page==='today'}">Heute</button><button data-action="all" aria-pressed="${page==='all'}">Alles</button></nav>`;}
shell.addEventListener('contextmenu',e=>{const t=e.target.closest('[data-tile]');if(t){e.preventDefault();detail={type:'node-settings',id:t.dataset.tile};render();}});
shell.addEventListener('keydown',e=>{const t=e.target.closest('[data-tile]');if(t&&(e.key==='ContextMenu'||e.key==='F10'&&e.shiftKey)){e.preventDefault();detail={type:'node-settings',id:t.dataset.tile};render();}});
shell.addEventListener('input',e=>{if(e.target.matches('.fg-name'))graph.name=e.target.value;if(e.target.name==='start'){const days=shell.querySelector('[name=days]');if(days)days.disabled=!e.target.checked;}});
shell.addEventListener('click',e=>{const submit=e.target.closest('button[type=submit]');if(submit){e.preventDefault();const form=submit.closest('form');if(form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));return;}if(suppressClick){suppressClick=false;return;}const grip=e.target.closest('[data-grip]');if(grip){if(e.detail===0){beginMove(grip.dataset.id,grip.dataset.grip);root.querySelector('[data-target]')?.focus();}return;}const drop=e.target.closest('[data-target]');if(drop){setPreview(drop.dataset.target,drop.dataset.kind);if(e.detail===0)root.querySelector('[data-action=apply-move]')?.focus();return;}const el=e.target.closest('[data-action]');if(!el)return;const {action,id}=el.dataset;
 if(action==='node'){detail={type:'node',id};move=null;preview=null;}if(action==='edge'&&!move&&graph.edges.some(e=>e.id===id))detail={type:'edge',id};if(action==='close-detail')detail=null;if(action==='add'){detail={type:'create-node'};render();shell.querySelector('[name=name]').focus();return;}if(action==='undo'&&history.length){graph=history.pop();move=null;preview=null;detail=null;notice='Änderung rückgängig gemacht.';}if(action==='cancel-move'){move=null;preview=null;}if(action==='apply-move'){finishMove();return;}if(action==='next'){if(!graph.name.trim()||!graph.nodes.length){notice='Ablaufname und mindestens einen Schritt ergänzen.';}else{stage=2;move=null;preview=null;}}if(action==='back')stage=1;
 if(action==='save'){const orphan=graph.nodes.find(n=>!ins(n.id).length&&!graph.starts.some(s=>s.roots.includes(n.id)));if(orphan){stage=1;detail={type:'node',id:orphan.id};notice='Diesen Schritt als Start anbieten oder verknüpfen.';}else{saved=clone(graph);page='today';notice='Entwurf gespeichert · nur in dieser Vorschau';}}
 if(action==='cap')detail={type:'cap',id};if(action==='new-cap')detail={type:'cap',id:null};if(action==='rule')detail={type:'rule',cap:el.dataset.cap,id};if(action==='new-rule')detail={type:'rule',cap:id,id:null};
 if(action==='delete-rule'){const g=clone(graph);g.caps.find(c=>c.id===detail.cap).rules=g.caps.find(c=>c.id===detail.cap).rules.filter(r=>r.id!==detail.id);detail=null;commit(g,'Zuordnung entfernt.');return;}
 if(action==='delete-node'){const g=clone(graph);g.nodes=g.nodes.filter(n=>n.id!==id);g.edges=g.edges.filter(e=>e.a!==id&&e.b!==id);g.caps.forEach(c=>c.rules=c.rules.filter(r=>r.from!==id&&r.to!==id));detail=null;commit(g,'Schritt und zugehörige Verbindungen entfernt.');return;}
 if(action==='delete-edge'){const g=clone(graph);g.edges=g.edges.filter(e=>e.id!==id);detail=null;commit(g,'Verbindung gelöst.');return;}
 if(action==='cancel-editor'){graph=clone(saved);history=[];detail=null;move=null;preview=null;page='today';notice='Entwurf verworfen. Laufende Ketten bleiben unverändert.';}if(action==='edit'){graph=clone(saved);page='edit';stage=1;detail=null;notice='';}if(action==='today')page='today';if(action==='all')page='all';if(action==='later'){later=true;notice='';}if(action==='return-sheet'){later=false;notice='';}if(action==='other')notice='Zähneputzen erledigt.';
 if(action==='start'){const s=saved.starts.find(s=>s.id===id);if(s){const r=makeRun(s);if(fits(needs(r.g,s.roots,r.ids))){beginAction(r,s.roots,true);return;}}}if(action==='act'){const r=runs.find(r=>r.id===id);if(r&&available(r).includes(el.dataset.nodeid)){beginAction(r,[el.dataset.nodeid]);return;}}
 if(action==='wait'){const r=runs.find(r=>r.id===id);question={type:'wait',r,w:r.waits.find(w=>w.id===el.dataset.wait)};}if(action==='cancel-question')question=null;if(action==='confirm'){const r=runs.find(r=>r.id===id),w=r.waits.find(w=>w.id===el.dataset.nodeid);w.done=true;releaseClaims(r);}if(action==='collect'){const r=runs.find(r=>r.id===id);if(r&&!r.collected&&done(r)){r.collected=true;notice=`${r.earned} Tau eingesammelt.`;}}render();});
shell.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')&&e.target.closest('form')){e.preventDefault();const form=e.target.closest('form');if(form.reportValidity())form.dispatchEvent(new Event('submit',{bubbles:true,cancelable:true}));}});
shell.addEventListener('submit',e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();const f=new FormData(form),type=form.dataset.form,g=clone(graph);
 if(type==='node'||type==='create-node'){const value=String(f.get('name')).trim(),h=Number(f.get('duration'))*Number(f.get('unit'));if(!value||!Number.isFinite(h)||h<0)return;const n=type==='node'?node(detail.id,g):{id:'n'+(++serial),tau:3};n.name=value;n.wait={h,ask:f.has('ask'),confirm:false};if(type==='create-node')g.nodes.push(n);}
 if(type==='add'){const value=String(f.get('newname')).trim();if(!value)return;g.nodes.push({id:'n'+(++serial),name:value,tau:3});adding=false;commit(g,'Schritt angelegt.');return;}
 if(type==='node-settings'){const n=node(detail.id,g);n.name=String(f.get('name')).trim();if(!n.name)return;n.tau=Number(f.get('tau'));const s=g.starts.find(s=>s.roots.includes(n.id));if(f.has('start')){if(s)s.days=Number(f.get('days'));else g.starts.push({id:'s'+n.id,roots:[n.id],days:Number(f.get('days'))||1});}else g.starts.forEach(s=>s.roots=s.roots.filter(id=>id!==n.id));}
 if(type==='edge'){const ed=g.edges.find(e=>e.id===detail.id);ed.h=Number(f.get('duration'))*Number(f.get('unit'));ed.ask=f.has('ask');ed.confirm=f.has('confirm');node(ed.a,g).wait={h:ed.h,ask:ed.ask,confirm:ed.confirm};}
 if(type==='cap'){const c=g.caps.find(c=>c.id===detail.id);if(c){c.name=String(f.get('name')).trim();c.total=Number(f.get('total'));}else g.caps.push({id:'c'+(++serial),name:String(f.get('name')).trim(),total:Number(f.get('total')),rules:[]});}
 if(type==='rule'){if(!reaches(String(f.get('from')),String(f.get('to')))){form.querySelector('[data-error]').textContent='Der Freigabeschritt muss nach dem Reservierungsbeginn liegen.';return;}const c=g.caps.find(c=>c.id===detail.cap),rule={id:detail.id||'rule'+(++serial),qty:Number(f.get('qty')),from:String(f.get('from')),to:String(f.get('to')),release:String(f.get('release'))};c.rules=c.rules.filter(r=>r.id!==rule.id).concat(rule);}
 if(type==='duration'){const q=question;if(q.isNew)runs.push(q.r);perform(q.r,q.ids,Object.fromEntries(q.edges.map(e=>[e.id,Number(f.get(e.id))])));question=null;render();return;}
 if(type==='wait'){question.w.until=Math.max(clock,question.w.until)+Number(f.get('hours'));question.w.done=false;question=null;render();return;}
 detail=null;commit(g,'Änderung übernommen.');});

// The tile follows the pointer; the graph stays unchanged until release.
root.addEventListener('pointerdown',e=>{const tile=e.target.closest('[data-tile]'),grip=e.target.closest('[data-grip]');if((!tile&&!grip)||e.button!==0)return;e.preventDefault();const id=(tile||grip).dataset.id||tile.dataset.tile,kind=grip?.dataset.grip||'step';pointer={id:e.pointerId,node:id,kind,x:e.clientX,y:e.clientY,lastX:e.clientX,lastY:e.clientY,moved:false};root.setPointerCapture(e.pointerId);});
root.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;pointer.lastX=e.clientX;pointer.lastY=e.clientY;if(!pointer.moved&&Math.hypot(dx,dy)>7){pointer.moved=true;const ptr=pointer;prepareTileDrag(ptr.node,ptr.kind);pointer=ptr;}if(pointer.moved){if(pointer.kind==='link'){const area=root.querySelector('.fg-board').getBoundingClientRect();const target=graph.nodes.filter(n=>n.id!==pointer.node).map(n=>({id:n.id,b:tileBox(n.id)})).find(n=>e.clientX-area.left>=n.b.x&&e.clientX-area.left<=n.b.x+n.b.w&&e.clientY-area.top>=n.b.y&&e.clientY-area.top<=n.b.y+n.b.h);const g=target?proposal(target.id,'link'):null;preview=g?{g,target:target.id,kind:'link'}:null;showTileHint(g?'Zusammenführen mit '+name(target.id):'Zum Folgeschritt ziehen');drawWires();}else moveTile(dx,dy);}});
root.addEventListener('pointerup',e=>{if(!pointer||pointer.id!==e.pointerId)return;const p=pointer;try{root.releasePointerCapture(e.pointerId);}catch{}if(p.moved)landTile(false);else{pointer=null;if(p.kind==='step'){detail={type:'node',id:p.node};render();}else beginMove(p.node,p.kind);}suppressClick=true;setTimeout(()=>suppressClick=false,0);});
root.addEventListener('pointercancel',()=>{if(tileDrag)landTile(true);pointer=null;});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(tileDrag){e.preventDefault();landTile(true);return;}if(detail||question){detail=null;question=null;render();}pointer=null;}if(e.key===' '&&e.target.closest('[data-tile]')&&!tileDrag){e.preventDefault();beginMove(e.target.closest('[data-tile]').dataset.tile,'step');return;}if(!keyboardDrag||!tileDrag)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();landTile(false);return;}const vectors={ArrowLeft:[-(boardMetric.tile+18),0],ArrowRight:[boardMetric.tile+18,0],ArrowUp:[0,-boardMetric.pitch],ArrowDown:[0,boardMetric.pitch]};if(vectors[e.key]){e.preventDefault();const d=vectors[e.key];moveTile(tileDrag.dx+d[0],tileDrag.dy+d[1]);}});
function tileAutoscroll(){if(pointer?.moved){const y=pointer.lastY,d=y<55?-10:y>innerHeight-55?10:0;if(d)window.scrollBy(0,d);}requestAnimationFrame(tileAutoscroll);}tileAutoscroll();
new ResizeObserver(()=>requestAnimationFrame(fitBoard)).observe(root);
function tweakRender(){if(options.example!==lastExample){lastExample=options.example;graph=captureWaits(options.example==='dinner'?dinner():laundry());saved=clone(graph);history=[];runs=[];later=false;stage=1;detail=null;move=null;preview=null;tileDrag=null;pointer=null;keyboardDrag=false;question=null;notice='';}clock=Number(options.hours);page=options.surface==='editor'?'edit':options.surface==='all'?'all':'today';render();}
render();if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:tweakRender});tweak.addSelect(options,'example',{label:'Prüfbeispiel (keine Vorlage)',options:[{label:'Wäsche · alternative Starts',value:'laundry'},{label:'Abendessen · ungleiche Parallelzweige',value:'dinner'}]});tweak.addSelect(options,'surface',{label:'Ansicht',options:[{label:'Editor',value:'editor'},{label:'Ablaufblatt',value:'today'},{label:'Alles',value:'all'}]});tweak.addSelect(options,'text',{label:'Schriftgröße',options:[{label:'Standard',value:'normal'},{label:'Groß · 160 %',value:'large'}]});tweak.addSlider(options,'hours',{label:'Zeit in der Vorschau',min:0,max:72,step:.5,unit:'Std.'});}
// Read-only inspection hook for the mockup acceptance checks; no production data is accessed.
root.flowMock={snapshot:()=>clone({graph,saved,history,move,preview,runs,page,stage,clock,boardMetric})};
})();
</script>
